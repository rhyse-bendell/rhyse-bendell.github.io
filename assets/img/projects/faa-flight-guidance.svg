<radialGradient id="glow"><stop stop-color="#57d9d9" stop-opacity=".28"/><stop offset="1" stop-color="#57d9d9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#95bdd1" stroke-opacity=".12"/></pattern>
</defs>
