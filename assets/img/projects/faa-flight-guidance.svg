<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Flight guidance and pilot performance</title>
<desc id="desc">Stylized aviation research dashboard featuring an instrument landing approach, runway perspective, navigation deviation indicators, and flight-path traces.</desc>
<defs>
